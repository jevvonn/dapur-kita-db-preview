services:
  postgres:
    image: postgres:15-alpine
    container_name: dapurkita-postgres
    environment:
      POSTGRES_USER: dapurkita
      POSTGRES_PASSWORD: dapurkita_password
      POSTGRES_DB: dapurkita_auth
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - pg_data:/var/lib/postgresql/data
    networks:
      - dapurkita-net

  mongodb:
    image: mongo:4.4
    container_name: dapurkita-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - dapurkita-net

  redis:
    image: redis:7-alpine
    container_name: dapurkita-redis
    ports:
      - "6379:6379"
    networks:
      - dapurkita-net

  neo4j:
    image: neo4j:5.15-community
    container_name: dapurkita-neo4j
    environment:
      NEO4J_AUTH: neo4j/dapurkita_password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    networks:
      - dapurkita-net

  compass-web:
    image: haohanyang/compass-web:latest
    container_name: dapurkita-compass
    environment:
      CW_MONGO_URI: mongodb://admin:password@mongodb:27017
    ports:
      - "8080:8080"
    depends_on:
      - mongodb
    networks:
      - dapurkita-net

  redisinsight:
    image: redis/redisinsight:latest
    container_name: dapurkita-redisinsight
    environment:
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: "6379"
      RI_REDIS_ALIAS: dapurkita-redis
    ports:
      - "5540:5540"
    volumes:
      - redisinsight_data:/data
    depends_on:
      - redis
    networks:
      - dapurkita-net

  neodash:
    image: neo4jlabs/neodash:latest
    container_name: dapurkita-neodash
    environment:
      ssoEnabled: "false"
      standalone: "false"
    ports:
      - "5005:5005"
    depends_on:
      - neo4j
    networks:
      - dapurkita-net

volumes:
  pg_data:
  mongo_data:
  neo4j_data:
  redisinsight_data:

networks:
  dapurkita-net:
    driver: bridge
