x-mongo-node: &mongo-node
  image: mongo:4.4
  environment:
    MONGO_REPLICA_KEY: ${MONGO_REPLICA_KEY:-dapurkitaReplicaSetKey2026}
  command: >
    bash -c 'echo "$$MONGO_REPLICA_KEY" > /etc/mongo-keyfile
    && chmod 400 /etc/mongo-keyfile && chown mongodb:mongodb /etc/mongo-keyfile
    && exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /etc/mongo-keyfile --bind_ip_all'
  healthcheck:
    test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping').ok"]
    interval: 5s
    timeout: 5s
    retries: 30
    start_period: 10s
  networks:
    - dapurkita-net

services:
  postgres:
    image: postgres:15-alpine
    container_name: dapurkita-postgres
    environment:
      POSTGRES_USER: dapurkita
      POSTGRES_PASSWORD: dapurkita_password
      POSTGRES_DB: dapurkita_auth
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - pg_data:/var/lib/postgresql/data
    networks:
      - dapurkita-net

  mongodb:
    <<: *mongo-node
    container_name: dapurkita-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_REPLICA_KEY: ${MONGO_REPLICA_KEY:-dapurkitaReplicaSetKey2026}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  mongodb-secondary-1:
    <<: *mongo-node
    container_name: dapurkita-mongodb-secondary-1
    ports:
      - "27018:27017"
    volumes:
      - mongo_secondary_1_data:/data/db

  mongodb-secondary-2:
    <<: *mongo-node
    container_name: dapurkita-mongodb-secondary-2
    ports:
      - "27019:27017"
    volumes:
      - mongo_secondary_2_data:/data/db

  mongodb-secondary-3:
    <<: *mongo-node
    container_name: dapurkita-mongodb-secondary-3
    ports:
      - "27020:27017"
    volumes:
      - mongo_secondary_3_data:/data/db

  mongodb-init:
    image: mongo:4.4
    container_name: dapurkita-mongodb-init
    restart: on-failure
    command: mongo --host mongodb --username admin --password password --authenticationDatabase admin --quiet /init-replica.js
    volumes:
      - ./mongo/init-replica.js:/init-replica.js:ro
    depends_on:
      mongodb:
        condition: service_healthy
      mongodb-secondary-1:
        condition: service_healthy
      mongodb-secondary-2:
        condition: service_healthy
      mongodb-secondary-3:
        condition: service_healthy
    networks:
      - dapurkita-net

  redis:
    image: redis:7-alpine
    container_name: dapurkita-redis
    ports:
      - "6379:6379"
    networks:
      - dapurkita-net

  neo4j:
    image: neo4j:5.15-community
    container_name: dapurkita-neo4j
    environment:
      NEO4J_AUTH: neo4j/dapurkita_password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    networks:
      - dapurkita-net

  compass-web:
    image: haohanyang/compass-web:latest
    container_name: dapurkita-compass
    environment:
      CW_MONGO_URI: mongodb://admin:password@mongodb:27017,mongodb-secondary-1:27017,mongodb-secondary-2:27017,mongodb-secondary-3:27017/?replicaSet=rs0&authSource=admin
      CW_BASIC_AUTH_USERNAME: ${DASHBOARD_USER:-admin}
      CW_BASIC_AUTH_PASSWORD: ${DASHBOARD_PASSWORD:-dapurkita_dashboard}
    ports:
      - "8080:8080"
    depends_on:
      - mongodb
    networks:
      - dapurkita-net

  redisinsight:
    image: redis/redisinsight:latest
    container_name: dapurkita-redisinsight
    environment:
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: "6379"
      RI_REDIS_ALIAS: dapurkita-redis
    volumes:
      - redisinsight_data:/data
    depends_on:
      - redis
    networks:
      - dapurkita-net

  redisinsight-auth:
    image: nginx:alpine
    container_name: dapurkita-redisinsight-auth
    environment:
      BASIC_AUTH_USER: ${DASHBOARD_USER:-admin}
      BASIC_AUTH_PASSWORD: ${DASHBOARD_PASSWORD:-dapurkita_dashboard}
    command: >
      sh -c 'printf "%s:{PLAIN}%s\n" "$$BASIC_AUTH_USER" "$$BASIC_AUTH_PASSWORD" > /etc/nginx/.htpasswd
      && exec nginx -g "daemon off;"'
    ports:
      - "5540:80"
    volumes:
      - ./nginx/redisinsight.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - redisinsight
    networks:
      - dapurkita-net

  adminer:
    image: adminer:latest
    container_name: dapurkita-adminer
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - dapurkita-net

  adminer-auth:
    image: nginx:alpine
    container_name: dapurkita-adminer-auth
    environment:
      BASIC_AUTH_USER: ${DASHBOARD_USER:-admin}
      BASIC_AUTH_PASSWORD: ${DASHBOARD_PASSWORD:-dapurkita_dashboard}
    command: >
      sh -c 'printf "%s:{PLAIN}%s\n" "$$BASIC_AUTH_USER" "$$BASIC_AUTH_PASSWORD" > /etc/nginx/.htpasswd
      && exec nginx -g "daemon off;"'
    ports:
      - "8081:80"
    volumes:
      - ./nginx/adminer.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - adminer
    networks:
      - dapurkita-net

volumes:
  pg_data:
  mongo_data:
  mongo_secondary_1_data:
  mongo_secondary_2_data:
  mongo_secondary_3_data:
  neo4j_data:
  redisinsight_data:

networks:
  dapurkita-net:
    driver: bridge
